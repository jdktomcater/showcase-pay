input {
  tcp {
    port => 4560
    codec => json
  }
}

filter {
  json {
    source => "message"
  }

  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
    target => "@timestamp"
  }

  if [service] {
    mutate {
      copy => { "service" => "service_name" }
    }
  } else if [logger_name] {
    grok {
      match => { "logger_name" => "^com\.showcase\.(?<service>[a-z]+)" }
    }
  }

  if ![service_name] {
    mutate {
      add_field => { "service_name" => "unknown" }
    }
  }

  mutate {
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "showcase-pay-%{service_name}-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
