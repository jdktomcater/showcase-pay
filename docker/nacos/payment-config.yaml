# ============================================
# Payment Service Configuration
# ============================================

server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/showcase_pay?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: PaymentHikariCP

  cloud:
    function:
      definition: paymentCallbackHandler;refundProcessor

# RocketMQ Configuration
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: payment-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 3
    retry-times-when-send-async-failed: 3
  consumer:
    group: payment-consumer-group

# Payment specific settings
payment:
  channels:
    alipay:
      enabled: true
      timeout: 30000
    wechat:
      enabled: true
      timeout: 30000
  retry:
    max-attempts: 3
    delay: 5000
  mq:
    topic: PAYMENT_TOPIC
    consumer-group: payment-consumer-group

# Service name for tracing
SERVICE_NAME: payment-service
