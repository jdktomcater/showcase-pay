# ============================================
# Common Configuration (Shared)
# ============================================

# Redis Configuration
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# MyBatis Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.showcase.pay.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Logging Configuration
logging:
  level:
    root: INFO
    com.showcase.pay: DEBUG
    org.springframework.cloud: INFO
    com.alibaba.nacos: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  logstash:
    enabled: true
    host: ${LOGSTASH_HOST:logstash}
    port: 4560

# SkyWalking Tracing
skywalking:
  agent:
    service_name: ${SERVICE_NAME:showcase-pay}
    collector:
      backend_service: ${SW_AGENT_COLLECTOR_BACKEND_SERVICES:skywalking-oap:11800}
    logging:
      level: info

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
