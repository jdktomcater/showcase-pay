server:
  port: 8080

spring:
  application:
    name: showcase-pay-gateway
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        fail-fast: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Payment Service Route
        - id: showcase-pay-payment
          uri: lb://showcase-pay-payment
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@ipKeyResolver}"

        # Order Service Route
        - id: showcase-pay-order
          uri: lb://showcase-pay-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@ipKeyResolver}"

        # Crypto Service Route
        - id: showcase-pay-crypto
          uri: lb://showcase-pay-crypto
          predicates:
            - Path=/api/crypto/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@ipKeyResolver}"

        # Swagger Route for Payment Service
        - id: showcase-pay-payment-swagger
          uri: lb://showcase-pay-payment
          predicates:
            - Path=/payment/swagger-ui/**
          filters:
            - RewritePath=/payment/swagger-ui/(?<segment>.*), /swagger-ui/${segment}

        # Swagger Route for Order Service
        - id: showcase-pay-order-swagger
          uri: lb://showcase-pay-order
          predicates:
            - Path=/order/swagger-ui/**
          filters:
            - RewritePath=/order/swagger-ui/(?<segment>.*), /swagger-ui/${segment}

        # Swagger Route for Crypto Service
        - id: showcase-pay-crypto-swagger
          uri: lb://showcase-pay-crypto
          predicates:
            - Path=/crypto/swagger-ui/**
          filters:
            - RewritePath=/crypto/swagger-ui/(?<segment>.*), /swagger-ui/${segment}
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# Logging Configuration
logging:
  level:
    com.showcase.pay: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
  endpoint:
    health:
      show-details: always

# Knife4j Gateway Aggregation
springdoc:
  swagger-ui:
    path: /swagger-ui.html
